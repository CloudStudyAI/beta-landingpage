version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          : > .env.production
          if [ -n "$NEXT_PUBLIC_CLOUDSTUDY_APP_URL" ]; then
            printf 'NEXT_PUBLIC_CLOUDSTUDY_APP_URL=%s\n' "$NEXT_PUBLIC_CLOUDSTUDY_APP_URL" > .env.production
          fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
